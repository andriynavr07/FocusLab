name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:   # ручний запуск з вкладки Actions

# Нові коміти в тій самій гілці/PR скасовують попередній запуск
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Ім'я job (build) — саме його вибирати в Branch protection як required status check (#97)
  build:
    name: build
    runs-on: windows-latest   # frontend — WPF, збирається лише на Windows
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # SDK 9 потрібен, щоб відкрити Backend/FocusLab.slnx (формат .slnx).
      # Проєкти й далі таргетять net8.0.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Backend/FocusLab.slnx

      - name: Build
        run: dotnet build Backend/FocusLab.slnx --configuration Release --no-restore
