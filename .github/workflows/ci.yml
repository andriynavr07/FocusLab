name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:   # ручний запуск з вкладки Actions

# Нові коміти в тій самій гілці/PR скасовують попередній запуск
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Ім'я job (build) — саме його вибирати в Branch protection як required status check (#97)
  build:
    name: build
    runs-on: windows-latest   # frontend — WPF, збирається лише на Windows
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # SDK 9 потрібен, щоб відкрити Backend/FocusLab.slnx (формат .slnx).
      # Проєкти й далі таргетять net8.0.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Backend/FocusLab.slnx

      # Падає, якщо `dotnet format` змінив би хоч один файл (правила — .editorconfig).
      # Виправити локально: dotnet format <проєкт>  (див. documents/code-quality.md)
      - name: Check formatting (dotnet format)
        shell: pwsh
        run: |
          $failed = $false
          # Проєкти беремо зі slnx, щоб перевіряти рівно те, що збирається
          $projects = Select-String -Path Backend/FocusLab.slnx -Pattern 'Path="([^"]+\.csproj)"' |
            ForEach-Object { Join-Path Backend $_.Matches[0].Groups[1].Value }
          foreach ($project in $projects) {
            Write-Host "::group::dotnet format $project"
            dotnet format $project --verify-no-changes --no-restore --severity warn --verbosity normal
            if ($LASTEXITCODE -ne 0) {
              $failed = $true
              Write-Host "::error title=Formatting::$project потребує dotnet format"
            }
            Write-Host "::endgroup::"
          }
          if ($failed) { exit 1 }

      # Попередження збирання (CA* та IDE*) видно в логу й у підсумку `Warning(s)` наприкінці
      - name: Build
        run: dotnet build Backend/FocusLab.slnx --configuration Release --no-restore --verbosity minimal -consoleloggerparameters:Summary
      # coverlet.collector збирає покриття під час тестів (налаштування — coverlet.runsettings)
      - name: Test
        run: dotnet test Backend/FocusLab.slnx --configuration Release --no-build --logger trx --collect:"XPlat Code Coverage" --settings coverlet.runsettings --results-directory ${{ github.workspace }}/TestResults

      # Об'єднуємо звіти всіх тестових проєктів в один (HTML + Cobertura + Markdown для summary)
      - name: Generate coverage report
        if: always()
        shell: pwsh
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.4.1
          reportgenerator "-reports:TestResults/**/coverage.cobertura.xml" "-targetdir:CoverageReport" "-reporttypes:HtmlInline_AzurePipelines_Dark;Cobertura;MarkdownSummaryGithub" "-assemblyfilters:+FocusLab.*;+frontend"

      # Відсоток покриття FocusLab.Application — у summary запуску (вкладка Summary в Actions).
      # COVERAGE_MIN_APPLICATION — мінімальний поріг у %; 0 означає «не перевіряти» (щоб не ламати CI на старті).
      - name: Coverage summary
        if: always()
        shell: pwsh
        env:
          COVERAGE_MIN_APPLICATION: 0
        run: |
          $file = 'CoverageReport/Cobertura.xml'
          if (-not (Test-Path $file)) {
            "### Покриття коду`nЗвіт не створено (тести не запустились)." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            exit 0
          }
          [xml]$xml = Get-Content $file
          $pkg = $xml.coverage.packages.package | Where-Object { $_.name -eq 'FocusLab.Application' }
          $total = [math]::Round([double]$xml.coverage.'line-rate' * 100, 1)
          $app = if ($pkg) { [math]::Round([double]$pkg.'line-rate' * 100, 1) } else { $null }
          $lines = @('### Покриття коду тестами', '')
          $lines += if ($null -ne $app) { "**FocusLab.Application: $app %** (рядки)" } else { '**FocusLab.Application:** немає даних' }
          $lines += "Усього по рішенню: $total %"
          $lines += ''
          $lines += Get-Content CoverageReport/SummaryGithub.md
          $lines | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Write-Host "FocusLab.Application line coverage: $app %"
          $min = [double]$env:COVERAGE_MIN_APPLICATION
          if ($min -gt 0 -and $null -ne $app -and $app -lt $min) {
            Write-Host "::error title=Coverage::FocusLab.Application $app % < поріг $min %"
            exit 1
          }

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: CoverageReport/
          if-no-files-found: warn

      # if: always() — результати вантажаться навіть тоді, коли тести впали
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn